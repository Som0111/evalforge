name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      # No API key: every judge call in the suite is mocked.
      - run: pytest tests/ -v

  eval-gate:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # An undefined secret expands to an empty string, not an error.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Require GEMINI_API_KEY
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is empty. Add a repository secret named exactly GEMINI_API_KEY (Settings > Secrets and variables > Actions > Repository secrets). An Environment, Dependabot, or differently named secret is not visible to this job."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e .
      # Real judge run on the golden set. --gate exits 1 if weighted kappa < --min-kappa, or if the
      # run was too incomplete (API quota) to give a verdict.
      #
      # Threshold 0.05 is an ACCEPTED FINDING, not a quality target. The judge (prompt v2) agrees with
      # the human labels barely above chance: weighted kappa 0.053 on all 20 records with
      # gemini-3.1-flash-lite. It is lenient on conciseness and gives 3 to everything on relevance and
      # coherence (see HUMAN_GUIDE.md). The design target is 0.4 (config.MIN_WEIGHTED_KAPPA). This gate
      # only catches regressions below today's measured level; it does not show the judge is good.
      # The model is pinned to the one that produced 0.053: gemini-3.6-flash measured 0.037 (12 of 20
      # records), which would fail this threshold.
      #
      # Coverage 0.75 (config default 0.9): the Gemini free-tier quota consistently cuts a run short at
      # about 16 of 20 records (0.8). The verdict is therefore on a subset, and the last few records may
      # never be judged in CI. 12 of 20 (0.6) still fails as too incomplete.
      - run: python -m evalforge.evaluate v2 gemini-3.1-flash-lite --gate --min-kappa 0.05 --min-coverage 0.75
