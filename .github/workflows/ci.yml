name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      # No API key: every judge call in the suite is mocked.
      - run: pytest tests/ -v

  eval-gate:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e .
      # Real judge run on the golden set. --gate exits 1 if weighted kappa < MIN_WEIGHTED_KAPPA
      # or the run was too incomplete (API quota) to give a verdict.
      - run: python -m evalforge.evaluate v2 --gate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
